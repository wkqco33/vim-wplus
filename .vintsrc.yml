cmdargs:
  severity: style_guide
  env:
    neovim: false
  filetypes: vim
policies:
  # 프로젝트는 Vim 9.1+ 전용. vim9script가 아닌 레거시 스크립트를 사용한다.
  ProhibitImplicitScoping:
    enabled: false
  # script-local 변수에 s: prefix를 일관되게 사용하므로 비활성화 불필요.
  # 라인 컨티뉴에 \ 사용 허용 (cpo&vim 가정).
  ProhibitUnnecessaryDoubleQuote:
    enabled: false
  # echo/echomsg 허용 (유틸 메시지 함수가 사용).
  ProhibitCommandRelyOnUser:
    enabled: false