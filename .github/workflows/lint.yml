name: lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  vint:
    name: vint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vint
        run: pip install vim-vint
      - name: Run vint
        run: vint --style autoload plugin

  source-check:
    name: vim source check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vim
        run: sudo apt-get update && sudo apt-get install -y vim
      - name: Assert vim version
        # plugin/wplus.vim requires 9.1+; without this the other jobs would
        # silently pass on an older vim that never reaches the failing code.
        run: |
          vim --version | head -1
          vim -u NONE -i NONE -n -es -c 'if v:version < 901 | cquit | endif' -c 'qa!'
      - name: Load every module
        # Sources each file *and* calls its setup(), so a broken setup() fails
        # here rather than shipping. See test/load_check.vim.
        run: |
          rm -f load_errors.txt
          vim -Nu NONE -i NONE -n -es -S test/load_check.vim -c 'qa!'
          if [ ! -f load_errors.txt ]; then
            echo "vim exited before writing results -- treating as failure"
            exit 1
          fi
          if [ -s load_errors.txt ]; then
            echo "Load errors:"; cat load_errors.txt
            exit 1
          fi

  test:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vim
        run: sudo apt-get update && sudo apt-get install -y vim
      - name: Run tests
        run: ./test/run.sh
